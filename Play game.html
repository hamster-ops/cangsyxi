    if (!target){ toast('🎯 请选择训练目标', 1500); return; }

    G.coins -= it.price;
    let msg = '';
    if (it.id === 't_muscle'){ target.genes.muscle = clamp(target.genes.muscle + rndi(3,8), 5, 100); msg = '肌肉 +'; }
    else if (it.id === 't_stamina'){ target.genes.stamina = clamp(target.genes.stamina + rndi(3,8), 5, 100); msg = '耐力 +'; }
    else if (it.id === 't_balance'){ target.genes.balance = clamp(target.genes.balance + rndi(3,8), 5, 100); msg = '平衡 +'; }
    else if (it.id === 't_luck'){ target.genes.luck = clamp(target.genes.luck + rndi(3,8), 5, 100); msg = '幸运 +'; }
    else if (it.id === 't_height'){ target.genes.height = +clamp(target.genes.height + rnd(0.05,0.15), 0.35, 3.4).toFixed(2); msg = '身高 +'; }
    else if (it.id === 't_leg'){ target.genes.legLength = +clamp(target.genes.legLength + rnd(0.05,0.15), 0.12, 2.6).toFixed(2); msg = '腿长 +'; }
    else if (it.id === 't_weight'){ const d = rndi(5,20); target.genes.weight = Math.max(60, target.genes.weight - d); msg = '体重 -'+d+'kg'; }
    else if (it.id === 't_young'){ if (target.age > 1){ target.age--; msg = '年龄 -1'; } else { msg = '年龄已最低'; } }

    updateHUD();
    renderShop();
    toast('✅ 「'+target.name+'」 '+msg, 1800);

  G.coins -= it.price;
  if (it.id === 'lasso'){ G.lassoCount += 1; toast('🪢 套索 ×1（共 '+G.lassoCount+'）', 1500); }

  updateHUD();
  renderShop();
}

function startBetRace(){
  if (G.bet.sel < 0){ toast('🎰 请先选择一匹马', 1600); return; }
  if (G.coins < G.bet.amount){ toast('🪙 金币不足以支付下注', 1600); return; }

  G.coins -= G.bet.amount;
  updateHUD();

  const list = G.bet.list;
  // 自动跑：用与正式比赛同样的模拟逻辑
  const hs = [];
  for (let i=0;i<list.length;i++){
    hs.push({
      data: list[i], x: 0, v: 0, legPhase: Math.random()*10, fatigue: 0,
      finished: false, finishTime: 0,
      reaction: 0.15 + Math.random()*0.35,
      noiseSeed: Math.random()*100,
      fallen: false, fallTimer: 0, fallCount: 0,
      _facing: 1, lane: i
    });
  }

  // 简单的无渲染模拟，跑完后弹出结果
  let t = 0;
  let done = false;
  while (t < 60 && !done){
    t += 0.016;
    let all = true;
    for (let i=0;i<hs.length;i++){
      const r = hs[i];
      if (r.finished){ continue; }
      all = false;
      updateRacerVirtual(r, 0.016, t);
    }
    if (all) done = true;
  }

  hs.sort(function(a,b){ return (a.finishTime || 999) - (b.finishTime || 999); });
  const win = hs[0];
  const myHorse = list[G.bet.sel];
  const iWin = (win.data === myHorse);
  const odds = G.bet.odds[G.bet.sel];

  let payout = 0;
  if (iWin){
    payout = Math.round(G.bet.amount * odds);
    G.coins += payout;
  }
  updateHUD();

  /* 结果展示 */
  const body = document.getElementById('resultBody');
  const medals = ['🥇','🥈','🥉','4️⃣'];
  let html = '<div class="big">'+(iWin?'🎉 你押中了！':'😢 没押中')+'</div>' +
    '<div class="sub">下注 '+G.bet.amount+(iWin?'　赔率 ×'+odds.toFixed(2)+'　获得 🪙 '+payout:'　损失 🪙 '+G.bet.amount)+'</div>' +
    '<div class="plist">';
  for (let i=0;i<hs.length;i++){
    const r = hs[i];
    const tS = r.finishTime >= 900 ? '未完赛' : r.finishTime.toFixed(2)+'s';
    const fallTxt = r.fallCount > 0 ? '　摔倒'+r.fallCount+'次' : '';
    const isMine = (r.data === myHorse);
    html += '<div class="prow '+(isMine?'me':'')+'">' +
      '<span class="place">'+(medals[i]||(i+1))+'</span>' +
      '<span class="pn">'+r.data.name+(isMine?' (你押的)':'')+fallTxt+'</span>' +
      '<span class="pt">'+tS+'</span></div>';
  }
  html += '</div>';
  body.innerHTML = html;
  document.getElementById('resultOverlay').classList.remove('hidden');
  document.getElementById('btnCloseResult').dataset.fromBet = '1';
  G.paused = true;
  G.mode = 'betResult';
}

function updateRacerVirtual(r, dt, t){
  if (t < r.reaction) return;
  const g = effGenes(r.data);
  const M = moveStyleOf(r.data.look.shape);

  if (r.fallen){
    r.fallTimer -= dt;
    r.v *= Math.pow(0.1, dt);
    r.x += r.v * dt;
    if (r.fallTimer <= 0){ r.fallen = false; r.fatigue += 0.06; }
    if (r.x >= RACE_LEN){ r.finished = true; r.finishTime = t; }
    return;
  }

  const kindSpd = r.data.kind === 'car' ? 1.12 : (r.data.kind === 'whale' ? 0.9 : 1);
  const fatigueFactor = 1 - 0.42 * clamp(r.fatigue, 0, 1);
  let thrust = 0.55 * g.muscle * (0.6 + 0.8 * g.legLength) * fatigueFactor * M.speed * kindSpd;
  if (g.temper === 'wild') thrust *= 1 + Math.sin(t*3.1 + r.noiseSeed)*0.09;
  else if (g.temper === 'lazy') thrust *= t < 3.2 ? 0.84 : 1.05;
  else if (g.temper === 'calm') thrust *= 1 + Math.sin(t*1.7 + r.noiseSeed)*0.02;
  thrust *= 1 + (g.luck/100)*0.05*Math.sin(t*5 + r.noiseSeed*3);

  const drag = 0.00055 * g.weight * r.v * r.v + 0.45 * r.v;
  const a = (thrust - drag) / (g.weight * 0.03);
  r.v = Math.max(0, r.v + a*dt);
  r.x += r.v * dt;
  r.legPhase += dt * (2.0 + r.v * 0.6) * M.legSpeed;

  const stamFactor = 110 / (g.stamina + 40);
  r.fatigue += dt * r.v * 0.0016 * stamFactor;

  const weirdFrac = clamp(r.data.weirdness / 18, 0, 1);
  const balanceFactor = clamp(1 - g.balance/100, 0, 1);
  const speedFactor = clamp(r.v / 20, 0, 1.2);
  const fallChance = (balanceFactor * 0.55 + weirdFrac * 0.30) * speedFactor * dt * 1.1;
  if (Math.random() < fallChance && r.x < RACE_LEN - 3){
    r.fallen = true;
    r.fallCount++;
    r.fallTimer = 1.2 + Math.random() * 1.6;
  }

  if (r.x >= RACE_LEN){
    r.x = RACE_LEN;
    r.finished = true;
    r.finishTime = t;
  }
}

document.getElementById('btnCloseStable').onclick = function(){
  document.getElementById('stableOverlay').classList.add('hidden');
  G.paused = false;
};
document.getElementById('btnCloseResult').onclick = function(){
  document.getElementById('resultOverlay').classList.add('hidden');
  const fromBet = document.getElementById('btnCloseResult').dataset.fromBet === '1';
  document.getElementById('btnCloseResult').dataset.fromBet = '0';
  if (fromBet){
    G.bet.list = [];
    G.bet.sel = -1;
    G.mode = 'world';
    G.paused = false;
    G.race = null;
    return;
  }
  G.race = null;
  G.mode = 'world';
  G.paused = false;
  document.getElementById('tip').textContent =
    'WASD / 方向键 移动　·　按住 Shift 冲刺　·　靠近目标点击甩套索';
};

/* 育马场 */
document.getElementById('btnBreed').onclick = function(){
  if (G.mode === 'race' || G.mode === 'betResult') return;
  renderBreed();
  document.getElementById('breedOverlay').classList.remove('hidden');
  G.paused = true;
};
document.getElementById('btnCloseBreed').onclick = function(){
  document.getElementById('breedOverlay').classList.add('hidden');
  G.paused = false;
};
document.getElementById('btnDoBreed').onclick = doBreed;

/* 商店 */
document.getElementById('btnShop').onclick = function(){
  if (G.mode === 'race' || G.mode === 'betResult') return;
  renderShop();
  document.getElementById('shopOverlay').classList.remove('hidden');
  G.paused = true;
};
document.getElementById('btnCloseShop').onclick = function(){
  document.getElementById('shopOverlay').classList.add('hidden');
  G.paused = false;
};
document.getElementById('trainTarget').onchange = function(e){
  G.shopTargetUid = parseInt(e.target.value, 10) || null;
};

/* 赌马场 */
document.getElementById('btnBet').onclick = function(){
  if (G.mode === 'race' || G.mode === 'betResult') return;
  if (!G.bet.list.length) rollBetList();
  renderBet();
  document.getElementById('betOverlay').classList.remove('hidden');
  G.paused = true;
};
document.getElementById('btnCloseBet').onclick = function(){
  document.getElementById('betOverlay').classList.add('hidden');
  G.paused = false;
};
document.getElementById('btnReroll').onclick = function(){
  rollBetList();
};
document.getElementById('btnStartBet').onclick = function(){
  startBetRace();
  document.getElementById('betOverlay').classList.add('hidden');
};

/* 筹码 */
(function(){
  const chips = document.querySelectorAll('.bet-money .chip');
  for (let i=0;i<chips.length;i++){
    chips[i].onclick = function(){
      for (let k=0;k<chips.length;k++) chips[k].classList.remove('on');
      chips[i].classList.add('on');
      G.bet.amount = parseInt(chips[i].dataset.amt, 10);
      renderBet();
    };
  }
})();

/* ============================== 主循环 ============================== */
let lastTime = performance.now();
function loop(now){
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  world.lastDt = dt;

  if (!G.paused){
    if (G.mode === 'world'){
      world.time += dt;
      updatePlayer(dt);
      for (let i=0;i<world.horses.length;i++) updateWildHorse(world.horses[i], dt);
      updateLasso(dt);
      updateCapture(dt);

      world.respawnTimer -= dt;
      if (world.respawnTimer <= 0){
        world.respawnTimer = 4;
        if (world.horses.length < 14) spawnWildHorse(false);
      }
    } else if (G.mode === 'race'){
      updateRace(dt);
    }
  }

  if (G.mode === 'race') renderRace();
  else renderWorld();

  requestAnimationFrame(loop);
}

/* ============================== 启动 ============================== */
buildWorld();
updateHUD();
if (G.stable.length === 0){
  // 送 2 匹开局马，方便立刻体验育马 / 商店 / 赌马
  const seedA = makeHorse('horse'); seedA.gender = 'male';
  const seedB = makeHorse('horse'); seedB.gender = 'female';
  G.stable.push(seedA, seedB);
  G.shopTargetUid = seedA.uid;
  updateHUD();
  setTimeout(function(){
    toast('🎁 赠送开局马「'+seedA.name+'」♂ 与「'+seedB.name+'」♀，去育马场试试吧！', 3400);
  }, 900);
}
toast('🐎 欢迎来到原野！小心，听说这里还有汽车和鲸鱼娘……', 3000);
requestAnimationFrame(loop);
</script>
